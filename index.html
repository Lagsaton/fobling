<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fobling</title>
  <meta name="description" content="A tiny creature that lives on your NFC keyring.">
  <meta name="theme-color" content="#f2e8d5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 8c17 0 24 15 24 28s-11 20-24 20S8 49 8 36 15 8 32 8Z' fill='%23f0a35e' stroke='%231d1916' stroke-width='4'/%3E%3Ccircle cx='24' cy='34' r='4' fill='%231d1916'/%3E%3Ccircle cx='40' cy='34' r='4' fill='%231d1916'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="tapviz" aria-hidden="true">
        <span class="ring"></span><span class="ring r2"></span>
        <svg viewBox="0 0 120 120" class="fob">
          <circle cx="60" cy="22" r="12" fill="none" stroke="var(--ink)" stroke-width="5"/>
          <path d="M30 52c0-14 12-22 30-22s30 8 30 22v26c0 16-13 28-30 28S30 94 30 78Z" fill="var(--accent)" stroke="var(--ink)" stroke-width="5"/>
          <path d="M46 64a20 20 0 0 1 28 0M51 72a11 11 0 0 1 18 0" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round"/>
          <circle cx="60" cy="81" r="4" fill="#fffaf0"/>
        </svg>
      </div>
      <h2 id="sheet-title">Tap your fob</h2>
      <p id="sheet-hint"></p>
      <button class="btn" id="sheet-cancel">Cancel</button>
    </div>
  </div>

  <div class="sheet doc" id="doc" hidden>
    <div class="sheet-card doc-card" role="dialog" aria-modal="true" aria-labelledby="doc-title">
      <h2 id="doc-title"></h2>
      <div class="doc-body"></div>
      <button class="btn" data-close>Close</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="banner">Fobling needs JavaScript.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
